name: Congressen scrapen

on:
  schedule:
    # Elke maandag en donderdag 06:00 UTC
    - cron: "0 6 * * 1,4"
  workflow_dispatch: {}

permissions:
  contents: write
  pull-requests: write

jobs:
  scrape:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Installeer dependencies
        run: pip install -r scripts/requirements.txt

      - name: Scrape bekende bronnen
        run: python3 scripts/scrape_congressen.py

      - name: Agenda-feed (agenda.ics) bijwerken
        run: python3 scripts/bouw_agenda.py

      - name: Open pull request als er wijzigingen zijn
        id: pr
        uses: peter-evans/create-pull-request@v6
        with:
          # PAT i.p.v. GITHUB_TOKEN: PR's van GITHUB_TOKEN starten geen workflows,
          # dus de check "Controle" zou nooit draaien en auto-merge blijft hangen.
          token: ${{ secrets.PAT_AUTOMERGE }}
          commit-message: "Congressen bijwerken via automatische scrape"
          title: "Automatische update: congressendata"
          body: |
            Automatisch gegenereerd door `scripts/scrape_congressen.py` op basis van de bekende bronnen (ESAIC, ESRA, PAINWeek, ASRA).

            Controleer de wijzigingen voordat je merget -- vooral entries met een `letOp`-veld verdienen een extra check.
          branch: auto/scrape-congressen
          delete-branch: true

      - name: Auto-merge aanzetten (merget zodra Controle slaagt)
        if: steps.pr.outputs.pull-request-number != ''
        env:
          GH_TOKEN: ${{ secrets.PAT_AUTOMERGE }}
        run: gh pr merge "${{ steps.pr.outputs.pull-request-number }}" --auto --squash --repo "${{ github.repository }}"
